<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16395f">
  <title>Bilangan Rasional Kelas VII</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-route="home" aria-label="Beranda aplikasi">
      <span class="brand-icon"><img src="assets/icons/book.svg" alt="" class="ui-icon ui-icon-lg"></span>
      <span>
        <strong>MATEMATIKA KELAS VII</strong>
        <small>Bilangan Rasional</small>
      </span>
    </button>
    <div class="top-progress">
      <div class="progress-track"><div id="globalProgressBar" class="progress-fill"></div></div>
      <span id="globalProgressText">0%</span>
    </div>
    <div class="top-actions">
      <span class="chip"><img src="assets/icons/star.svg" alt="" class="ui-icon"> <b id="xpValue">0</b> XP</span>
      <button id="soundBtn" class="icon-btn" aria-label="Suara">🔇</button>
      <button id="fullscreenBtn" class="icon-btn" aria-label="Layar penuh">⛶</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <nav class="bottom-nav">
    <button data-route="home"><img src="assets/icons/home.svg" alt="" class="nav-icon"><span>Beranda</span></button>
    <button data-route="learn"><img src="assets/icons/learn.svg" alt="" class="nav-icon"><span>Belajar</span></button>
    <button data-route="quiz"><img src="assets/icons/target.svg" alt="" class="nav-icon"><span>Evaluasi</span></button>
    <button data-route="progress"><img src="assets/icons/badge.svg" alt="" class="nav-icon"><span>Progress</span></button>
  </nav>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Eksplorasi</h2>
        <button class="icon-btn" data-close-modal aria-label="Tutup">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="confetti" class="confetti-layer" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
